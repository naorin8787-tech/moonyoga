<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Noto Serif JP', serif;
  }
  body.contact-page {
    background: #dcb8e6;
    color: #ffffff;
    padding: 60px 24px 80px;
  }
  .wrap {
    max-width: 420px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-weight: 300;
    font-size: 32px;
    letter-spacing: 0.35em;
    margin: 0 0 20px;
    padding-left: 0.35em;
  }
  .title-rule {
    width: 160px;
    height: 1px;
    background: rgba(255, 255, 255, 0.7);
    margin: 0 auto 56px;
  }
  .intro {
    text-align: center;
  }
  .intro .lead {
    font-size: 13px;
    letter-spacing: 0.15em;
    margin: 0 0 22px;
  }
  .intro p {
    font-size: 13px;
    line-height: 2.1;
    letter-spacing: 0.08em;
    margin: 0;
    opacity: 0.95;
  }
  .section-rule {
    width: 160px;
    height: 1px;
    background: rgba(255, 255, 255, 0.7);
    margin: 40px auto 44px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 36px;
  }
  label {
    display: block;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.2em;
    margin-bottom: 14px;
  }
  input[type="text"],
  input[type="email"],
  input[type="date"],
  textarea {
    width: 100%;
    border: none;
    border-radius: 2px;
    background: #ffffff;
    color: #333333;
    font-family: 'Noto Serif JP', serif;
    font-size: 14px;
    padding: 14px 16px;
    outline: none;
  }
  input::placeholder,
  textarea::placeholder {
    color: #b9b9b9;
    letter-spacing: 0.05em;
  }
  input[type="date"] {
    text-align: center;
    color: #333333;
    appearance: none;
    -webkit-appearance: none;
  }
  input[type="date"]:not(.has-value)::-webkit-datetime-edit {
    color: #b9b9b9;
  }
  textarea {
    min-height: 110px;
    resize: vertical;
    line-height: 1.7;
  }
  .submit-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 4px;
  }
  button {
    background: #b98ec8;
    color: #ffffff;
    border: none;
    border-radius: 2px;
    padding: 14px 40px;
    font-family: 'Noto Serif JP', serif;
    font-size: 14px;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover {
    background: #a97cb8;
  }
  button:active {
    background: #9a6ea8;
  }
  @media (max-width: 380px) {
    h1 { font-size: 26px; letter-spacing: 0.28em; }
    body.contact-page { padding: 48px 18px 64px; }
  }
</style>
</head>
<body class="contact-page">
<div class="wrap">
  <h1>Contact</h1>
  <div class="title-rule"></div>

  <div class="intro">
    <p class="lead">体験クラスのお申し込み</p>
    <p>
      体験クラスをご希望の方は、下記フォームより<br>
      お気軽にお問い合わせください。
    </p>
  </div>

  <div class="section-rule"></div>

  <form id="contactForm">
    <div>
      <label for="name">名前</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div>
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div>
      <label for="class">希望クラス</label>
      <input type="text" id="class" name="class">
    </div>

    <div>
      <label for="date">希望日</label>
      <input type="date" id="date" name="date" onchange="this.classList.add('has-value')">
    </div>

    <div>
      <textarea id="message" name="message" placeholder="ご質問、ご希望があればご記入ください。"></textarea>
    </div>

    <div class="submit-row">
      <button type="submit">送信</button>
    </div>
  </form>
</div>

<script>
  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('送信されました（デモ）。実際のフォーム送信処理をここに接続してください。');
  });
</script>
</body>
</html>
